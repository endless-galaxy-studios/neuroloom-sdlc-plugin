# Neuroloom SDLC Plugin — Post-Execution Transforms
#
# Declares transforms wired into installed skills during init/migrate.
# The neuroloom-transformer agent is dispatched after these skills complete
# to apply Neuroloom-specific augmentation to their output files.

# Tool profiles — different agent roles get different tool subsets.
# Referenced by name in the transforms below.
#
# ASSUMPTION: the tool names below are `mcp__neuroloom__<tool>`, which holds when
# the project registers the Neuroloom MCP server under the name `neuroloom` in its
# own .mcp.json. The base plugin (neuroloom-claude-plugin) ships an empty .mcp.json
# and no MCP server (checked at 0.9.1), so the plugin-scoped tool namespace (the
# `mcp__plugin_...` form) never loads and is not used here. This file cannot read
# the project's .mcp.json; a project that names its server differently must
# rename the prefix in its installed agents' `tools:` lines.
tool_profiles:
  full:
    description: All Neuroloom tools — for implementation agents that read, write, and navigate
    tools:
      - mcp__neuroloom__memory_search
      - mcp__neuroloom__memory_explore
      - mcp__neuroloom__memory_by_file
      - mcp__neuroloom__memory_get_detail
      - mcp__neuroloom__memory_get_index
      - mcp__neuroloom__memory_rate
      - mcp__neuroloom__memory_store
      - mcp__neuroloom__memory_update
      - mcp__neuroloom__code_search
      - mcp__neuroloom__code_context
      - mcp__neuroloom__code_callers
      - mcp__neuroloom__code_callees
      - mcp__neuroloom__code_navigate

  read_only:
    description: Search and navigate only — for reviewers and auditors that consume but don't produce knowledge
    tools:
      - mcp__neuroloom__memory_search
      - mcp__neuroloom__memory_explore
      - mcp__neuroloom__memory_by_file
      - mcp__neuroloom__memory_get_detail
      - mcp__neuroloom__memory_get_index
      - mcp__neuroloom__memory_rate
      - mcp__neuroloom__code_search
      - mcp__neuroloom__code_context
      - mcp__neuroloom__code_callers
      - mcp__neuroloom__code_callees
      - mcp__neuroloom__code_navigate

  knowledge_contributor:
    description: Search + store — for agents that discover patterns and write them back
    tools:
      - mcp__neuroloom__memory_search
      - mcp__neuroloom__memory_explore
      - mcp__neuroloom__memory_by_file
      - mcp__neuroloom__memory_get_detail
      - mcp__neuroloom__memory_get_index
      - mcp__neuroloom__memory_rate
      - mcp__neuroloom__memory_store
      - mcp__neuroloom__memory_update
      - mcp__neuroloom__code_search
      - mcp__neuroloom__code_context

# Tools a call in an agent's memory (.claude/agent-memory/<name>/) may add beyond the
# agent's profile, in migrate's tool injection and the port's Stage 4g. Agents write
# their own memory, so this lists only tools that read: a note must never give an
# agent a tool that writes. Taken from the MCP server's tools marked readOnlyHint
# (mcp/neuroloom_mcp/server.py), less the two that hand out upload URLs.
memory_grant_tools:
  tools:
    - mcp__neuroloom__memory_search
    - mcp__neuroloom__memory_explore
    - mcp__neuroloom__memory_by_file
    - mcp__neuroloom__memory_get_detail
    - mcp__neuroloom__memory_get_index
    - mcp__neuroloom__memory_get_related
    - mcp__neuroloom__memory_get_supersession_chain
    - mcp__neuroloom__memory_get_timeline
    - mcp__neuroloom__workspace_insight
    - mcp__neuroloom__session_get_context
    - mcp__neuroloom__sdlc_get_version
    - mcp__neuroloom__code_search
    - mcp__neuroloom__code_context
    - mcp__neuroloom__code_callers
    - mcp__neuroloom__code_callees
    - mcp__neuroloom__code_navigate

# Agent-to-profile mapping — determines which tools each agent gets.
# Agents not listed here get the "full" profile as default.
agent_profiles:
  code-reviewer: read_only
  sdlc-reviewer: read_only
  sdlc-compliance-auditor: read_only
  sdet: knowledge_contributor
  software-architect: full
  # Project-specific agents default to "full" unless overridden here

# Transforms wired into installed skills
transforms:
  - skill: sdlc-develop-agent
    description: Augment newly created agents with Neuroloom MCP tools and transform knowledge-routing references
    target_patterns:
      - ".claude/agents/*.md"
    actions:
      - inject_mcp_tools
      - transform_knowledge_context
      - transform_communication_protocol

  - skill: sdlc-develop-agent
    mode: ENRICH
    description: Re-apply Neuroloom transforms after agent enrichment (ENRICH mode of sdlc-develop-agent) modifies agent files
    target_patterns:
      - ".claude/agents/*.md"
    actions:
      - ensure_mcp_tools
      - transform_knowledge_context
      - transform_communication_protocol

  - skill: sdlc-develop-skill
    description: Apply Pattern Mapping to newly developed or modified skills that reference the knowledge layer, including each skill's references/ files (dispatch prompts and procedure detail that subagents read)
    target_patterns:
      - ".claude/skills/*/SKILL.md"
      - ".claude/skills/*/references/*.md"
    actions:
      - pattern_mapping

  - skill: sdlc-ingest
    description: Send the knowledge and discipline files the skill wrote to the Neuroloom backend, then remove them (the skill keeps writing files; pattern-mapping-rules.md § sdlc-ingest writes files)
    target_patterns:
      - "[sdlc-root]/knowledge/**/*.yaml"
      - "[sdlc-root]/disciplines/*.md"
    actions:
      - ingest_to_neuroloom

  - skill: sdlc-archive
    description: Sync the DocumentSource anchor (source_path, archival_status) of each deliverable doc Step 5 moves, and each idea brief, bug report and handoff Step 7 moves, from docs/current_work/ to docs/chronicle/
    dispatch_mode: path_pairs
    # No target_patterns: the pre-move path no longer exists on disk after Step 5's or Step 7's
    # copy-then-delete, so neither a path the skill names (the files: shape every other
    # transform uses) nor a glob can produce it. The skill assembles {old, new} pairs itself from its own
    # Step 4 approval table and passes them directly — see dispatch_mode below and
    # references/adapter-lifecycle.md § "Skill transform wiring" for the injected shape.
    actions:
      - sync_archive_status

# Action definitions
actions:
  inject_mcp_tools:
    description: Add Neuroloom MCP tools to the agent's tools frontmatter line
    behavior: |
      Read the agent file name, look up its profile in agent_profiles (default: full).
      Resolve the profile to a tool list from tool_profiles.
      If the tools: line does not already contain these tools, append them.

  ensure_mcp_tools:
    description: Verify MCP tools are still present after enrichment (may have rewritten the tools line)
    behavior: |
      Same as inject_mcp_tools but also verify no previously-present tools were removed.
      If tools were lost, re-inject them.

  transform_knowledge_context:
    description: Transform the agent's Knowledge Context section from file-path references to memory_search
    behavior: |
      Find ## Knowledge Context section.
      Apply Pattern Mapping instruction rules to transform file-path references.

  transform_communication_protocol:
    description: Transform the Communication Protocol reference to memory_search
    behavior: |
      Find the Communication Protocol reference line.
      Apply Pattern Mapping instruction rules.

  pattern_mapping:
    description: Apply the full two-pass Pattern Mapping pipeline
    behavior: |
      Pass 1: instruction + metadata rules (path-bearing transformations)
      Pass 2: concept-terminology rules (prose-only, no paths/code/Integration)
      Read ${CLAUDE_PLUGIN_ROOT}/references/pattern-mapping-rules.md for the full rule table.

  ingest_to_neuroloom:
    description: Route knowledge/discipline content to Neuroloom through the plugin's extractor and sdlc_seed
    behavior: |
      Instead of leaving the flat file on disk, seed the entries the skill's
      report says it added, through the plugin's extractor (--tag
      sdlc:project-specific, --only-ids) and sdlc_seed with skip_deprecation:
      true, so they share the ids every other path uses. The rules (which files,
      which ids are never sent, when the file is deleted, kept or renamed
      .unsent-<timestamp>) are agents/neuroloom-transformer.md's ingest_to_neuroloom.

  sync_archive_status:
    description: Sync a document's DocumentSource anchor to its post-archive location via PATCH /api/v1/documents/by-path
    dispatch_mode: path_pairs
    behavior: |
      Dispatched with path_pairs (see transforms: entry above), not a resolved files
      glob — every other action in this file operates on a static glob because the
      target file still exists at a discoverable path; this one doesn't, because the
      file has already moved by the time the transformer runs.

      For each {old, new} pair in path_pairs, call PATCH /api/v1/documents/by-path
      with target_source_path=old, new_source_path=new, archival_status="archived".

      A 404 response with code=document_source_not_found means the anchor was already
      updated by a prior attempt (or never existed, e.g. a document tier-gated at
      first ingest) — treat as a successful no-op, not a failure. Do not retry and do
      not re-buffer on this specific error code.

      This action makes no file-content edits and deletes nothing — it is a pure API
      side effect, unlike ingest_to_neuroloom which also mutates/deletes the file it
      processes.
